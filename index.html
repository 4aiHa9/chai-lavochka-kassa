<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Чайная Лавочка — Касса</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e7;color:#2b211b;font-family:Arial,sans-serif}header{background:#2b211b;color:#fff;padding:16px;font-size:20px;font-weight:800}header span{color:#e5b85c}nav{display:flex;gap:6px;overflow:auto;background:white;padding:8px;position:sticky;top:0}nav button,.btn{border:0;border-radius:10px;padding:11px;font-weight:700;background:#eee5d6}nav .active{background:#a52d29;color:white}main{max-width:1100px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:1.3fr .8fr;gap:12px}.card{background:#fffdf8;border:1px solid #e2d7c7;border-radius:16px;padding:14px;margin-bottom:12px}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{background:#fff;border:1px solid #ddd;cursor:pointer}.service{background:#f8ead1}.price{display:block;color:#a52d29;margin-top:4px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:9px 0}.total{font-size:26px;font-weight:900;margin:15px 0}.primary{width:100%;padding:13px;border:0;border-radius:10px;background:#a52d29;color:white;font-weight:900}input,select{width:100%;padding:10px;border:1px solid #d8ccb9;border-radius:9px;font-size:16px}label{display:block;font-size:13px;font-weight:bold;margin:8px 0 4px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;padding:12px;border:1px solid #ddd;border-radius:10px}.stat b{display:block;font-size:20px;margin-top:5px}.small{padding:8px;border:0;border-radius:8px;background:#eee5d6}.danger{background:#b83a34;color:#fff}@media(max-width:700px){.grid{grid-template-columns:1fr}.buttons{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header>🐒 Чайная <span>Лавочка</span></header>
<nav><button class="active" onclick="tab('sale',this)">🧾 Продажа</button><button onclick="tab('stock',this)">📦 Склад</button><button onclick="tab('services',this)">🛎️ Услуги</button><button onclick="tab('history',this)">📚 Чеки</button><button onclick="tab('report',this)">📊 Отчёт</button></nav>
<main>
<section id="sale"><div class="grid"><div>
<div class="card"><h2>Услуги</h2><div id="servicesSale" class="buttons"></div></div>
<div class="card"><h2>Чай по граммам</h2><div id="teaSale" class="buttons"></div></div>
<div class="card"><h2>Другие товары</h2><div id="otherSale" class="buttons"></div></div>
</div><div class="card"><h2>Текущий чек</h2><div id="cart"></div><div class="total">Итого: <span id="total">0</span> ₽</div><button class="primary" onclick="checkout()">✓ Закрыть чек</button><button class="small" style="width:100%;margin-top:8px" onclick="cart=[];drawCart()">Очистить</button></div></div></section>

<section id="stock" class="hidden"><div class="card"><h2>📦 Склад</h2><button class="primary" style="width:auto;margin-bottom:10px" onclick="newProduct()">＋ Добавить товар</button><div id="stockTable"></div></div>
<div id="productForm" class="card hidden"><h2>Товар</h2><label>Название</label><input id="pn"><label>Категория</label><select id="pc"><option>Чай</option><option>Кофе</option><option>Посуда</option><option>Моти</option><option>Напитки</option><option>Другое</option></select><label>Цена закупки</label><input id="pb" type="number" step=".01"><label>Цена продажи</label><input id="ps" type="number" step=".01"><label>Остаток</label><input id="pq" type="number" step=".01"><button class="primary" style="margin-top:10px" onclick="saveProduct()">Сохранить</button></div></section>

<section id="services" class="hidden"><div class="card"><h2>🛎️ Услуги</h2><button class="primary" style="width:auto;margin-bottom:10px" onclick="document.getElementById('serviceForm').classList.remove('hidden')">＋ Добавить услугу</button><div id="serviceTable"></div></div><div id="serviceForm" class="card hidden"><label>Название</label><input id="sn" placeholder="Чай за барной стойкой"><label>Цена</label><input id="sp" type="number"><button class="primary" style="margin-top:10px" onclick="saveService()">Сохранить</button></div></section>
<section id="history" class="hidden"><div class="card"><h2>📚 Чеки</h2><div id="historyTable"></div></div></section>
<section id="report" class="hidden"><div class="card"><h2>📊 Отчёт</h2><div id="stats" class="stats"></div></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
let products=JSON.parse(localStorage.lavProducts||'null')||[{name:'Пуэр',cat:'Чай',buy:400,sell:1,stock:1000},{name:'Да Хун Пао',cat:'Чай',buy:600,sell:2,stock:500},{name:'Лун Цзин',cat:'Чай',buy:700,sell:2,stock:500},{name:'Латте',cat:'Кофе',buy:35,sell:100,stock:100},{name:'Капучино',cat:'Кофе',buy:30,sell:100,stock:100},{name:'Американо',cat:'Кофе',buy:20,sell:100,stock:100}];
let services=JSON.parse(localStorage.lavServices||'null')||[{name:'Чай за барной стойкой',price:200},{name:'Чайник 1000 мл',price:150},{name:'Пинь Ча',price:250},{name:'VIP PS5 — 1 час',price:200}];
let checks=JSON.parse(localStorage.lavChecks||'[]'),cart=[],edit=-1;
function save(){localStorage.lavProducts=JSON.stringify(products);localStorage.lavServices=JSON.stringify(services);localStorage.lavChecks=JSON.stringify(checks)}
function tab(id,b){['sale','stock','services','history','report'].forEach(x=>$(x).classList.toggle('hidden',x!=id));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()}
function addService(i){let s=services[i];cart.push({name:s.name,type:'service',qty:1,unit:s.price,total:s.price});drawCart()}
function addTea(i){let p=products[i],g=prompt('Сколько грамм «'+p.name+'»?','10');if(g===null)return;g=Number(g);if(!g||g>p.stock)return alert('Недостаточно грамм');let x=cart.find(x=>x.type==='tea'&&x.product===i);if(x){x.qty+=g;x.total=x.qty*x.unit}else cart.push({name:p.name,type:'tea',qty:g,unit:p.sell,total:g*p.sell,product:i});drawCart()}
function addOther(i){let p=products[i];cart.push({name:p.name,type:'product',qty:1,unit:p.sell,total:p.sell,product:i});drawCart()}
function drawSale(){$('servicesSale').innerHTML=services.map((s,i)=>'<button class="btn service" onclick="addService('+i+')">'+s.name+'<span class="price">'+s.price+' ₽</span></button>').join('');$('teaSale').innerHTML=products.map((p,i)=>p.cat==='Чай'?'<button class="btn" onclick="addTea('+i+')">'+p.name+'<span class="price">'+p.sell+' ₽/г</span></button>':'').join('');$('otherSale').innerHTML=products.map((p,i)=>p.cat!=='Чай'?'<button class="btn" onclick="addOther('+i+')">'+p.name+'<span class="price">'+p.sell+' ₽</span></button>':'').join('');drawCart()}
function drawCart(){if(!cart.length){$('cart').innerHTML='<span>Чек пуст</span>';$('total').textContent=0;return}$('cart').innerHTML=cart.map((x,i)=>'<div class="row"><div>'+x.name+'<br><small>'+(x.type==='tea'?x.qty+' г × '+x.unit+' ₽':'1 × '+x.unit+' ₽')+'</small></div><b>'+x.total+' ₽ <button class="small" onclick="cart.splice('+i+',1);drawCart()">×</button></b></div>').join('');$('total').textContent=cart.reduce((a,x)=>a+x.total,0)}
function checkout(){if(!cart.length)return alert('Чек пуст');let total=cart.reduce((a,x)=>a+x.total,0);cart.forEach(x=>{if(x.product!==undefined)products[x.product].stock-=x.type==='tea'?x.qty:1});checks.unshift({id:Date.now(),date:new Date().toLocaleString('ru-RU'),items:cart,total});save();cart=[];alert('Чек закрыт на '+total+' ₽');draw()}
function newProduct(){$('productForm').classList.remove('hidden');edit=-1;['pn','pb','ps','pq'].forEach(x=>$(x).value='')}
function editProduct(i){edit=i;let p=products[i];$('productForm').classList.remove('hidden');$('pn').value=p.name;$('pc').value=p.cat;$('pb').value=p.buy;$('ps').value=p.sell;$('pq').value=p.stock}
function saveProduct(){if(!$('pn').value)return alert('Введите название');let p={name:$('pn').value,cat:$('pc').value,buy:+$('pb').value||0,sell:+$('ps').value||0,stock:+$('pq').value||0};if(edit<0)products.push(p);else products[edit]=p;save();$('productForm').classList.add('hidden');draw()}
function delProduct(i){if(confirm('Удалить товар?')){products.splice(i,1);save();draw()}}
function saveService(){if(!$('sn').value||!+$('sp').value)return alert('Заполните поля');services.push({name:$('sn').value,price:+$('sp').value});save();$('sn').value='';$('sp').value='';$('serviceForm').classList.add('hidden');draw()}
function delService(i){if(confirm('Удалить услугу?')){services.splice(i,1);save();draw()}}
function drawStock(){$('stockTable').innerHTML='<table><tr><th>Название</th><th>Кат.</th><th>Закупка</th><th>Продажа</th><th>Остаток</th><th></th></tr>'+products.map((p,i)=>'<tr><td>'+p.name+'</td><td>'+p.cat+'</td><td>'+p.buy+' ₽</td><td>'+p.sell+' ₽'+(p.cat==='Чай'?'/г':'')+'</td><td>'+p.stock+(p.cat==='Чай'?' г':'')+'</td><td><button class="small" onclick="editProduct('+i+')">✏️</button><button class="small danger" onclick="delProduct('+i+')">×</button></td></tr>').join('')+'</table>'}
function drawServices(){$('serviceTable').innerHTML='<table><tr><th>Услуга</th><th>Цена</th><th></th></tr>'+services.map((s,i)=>'<tr><td>'+s.name+'</td><td>'+s.price+' ₽</td><td><button class="small danger" onclick="delService('+i+')">Удалить</button></td></tr>').join('')+'</table>'}
function drawHistory(){$('historyTable').innerHTML=checks.length?'<table><tr><th>Чек</th><th>Дата</th><th>Состав</th><th>Итого</th></tr>'+checks.map(c=>'<tr><td>'+String(c.id).slice(-5)+'</td><td>'+c.date+'</td><td>'+c.items.map(x=>x.name+' × '+(x.type==='tea'?x.qty+' г':1)).join(', ')+'</td><td><b>'+c.total+' ₽</b></td></tr>').join('')+'</table>':'Чеков пока нет'}
function drawReport(){let r=checks.reduce((a,c)=>a+c.total,0),n=checks.length,t=checks.flatMap(c=>c.items).filter(x=>x.type==='tea').reduce((a,x)=>a+x.qty,0);$('stats').innerHTML='<div class="stat">Выручка<b>'+r+' ₽</b></div><div class="stat">Чеков<b>'+n+'</b></div><div class="stat">Средний чек<b>'+(n?Math.round(r/n):0)+' ₽</b></div><div class="stat">Чая продано<b>'+t+' г</b></div>'}
function draw(){drawSale();drawStock();drawServices();drawHistory();drawReport()}draw();
</script></body></html>
